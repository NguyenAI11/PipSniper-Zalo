name: Build Android Probe APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Static privacy validation
        run: python3 tools/static_validate.py

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Inspect APK permissions and metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$APK"
          "$AAPT" dump permissions "$APK" | tee permissions.txt
          "$AAPT" dump badging "$APK" | tee badging.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "ERROR: INTERNET permission must not be present"
            exit 1
          fi
          sha256sum "$APK" | tee sha256.txt
          cp "$APK" PipSniper_Zalo_Probe_V0.2-debug.apk

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PipSniper-Zalo-Probe-V0.2-verified
          if-no-files-found: error
          retention-days: 14
          path: |
            PipSniper_Zalo_Probe_V0.2-debug.apk
            sha256.txt
            permissions.txt
            badging.txt
