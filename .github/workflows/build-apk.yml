name: Build PipSniper Zalo Bridge V1

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Static bridge validation
        run: python3 tools/static_validate.py

      - name: Unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest

      - name: Build debug APK and release AAB
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug
          gradle --no-daemon --stacktrace :app:bundleRelease

      - name: Inspect APK and permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$APK"
          test -f "$AAB"

          "$AAPT" dump permissions "$APK" | tee permissions.txt
          "$AAPT" dump badging "$APK" | tee badging.txt
          grep -q "android.permission.INTERNET" permissions.txt
          grep -q "package: name='com.pipsniper.zaloprobe'" badging.txt
          grep -q "versionName='1.0.0'" badging.txt

          sha256sum "$APK" | tee apk-sha256.txt
          sha256sum "$AAB" | tee aab-unsigned-sha256.txt
          cp "$APK" PipSniper_Zalo_Bridge_V1.0-debug.apk
          cp "$AAB" PipSniper_Zalo_Bridge_V1.0-release-unsigned.aab

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PipSniper-Zalo-Bridge-V1.0-verified
          if-no-files-found: error
          retention-days: 14
          path: |
            PipSniper_Zalo_Bridge_V1.0-debug.apk
            PipSniper_Zalo_Bridge_V1.0-release-unsigned.aab
            apk-sha256.txt
            aab-unsigned-sha256.txt
            permissions.txt
            badging.txt
