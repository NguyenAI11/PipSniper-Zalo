plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pipsniper.zaloprobe'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pipsniper.zaloprobe'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
